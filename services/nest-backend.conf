# Sourceable Bash configuration (no spaces around =)
IMAGE_REPO=ghcr.io/hiwjdgh/nest-backend  # [ORG] ghcr.io/<org>/nest-backend 로 변경
SERVER_NAME=nest.localhost
CONTAINER_PORT=3000
HEALTH_PATH=/  # 실제 앱에서는 @nestjs/terminus 등으로 /health 를 만들고 변경 권장 (globalPrefix 사용 시 /api/health)
MEMORY_LIMIT=512m  # 기본 상한 (서버별 변경은 .env 의 MEMORY_LIMIT_NEST_BACKEND)
NODE_HEAP_PERCENT=75  # NODE_OPTIONS=--max-old-space-size 를 상한의 75%로 자동 설정
