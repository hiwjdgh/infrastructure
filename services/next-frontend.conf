# Sourceable Bash configuration (no spaces around =)
IMAGE_REPO=ghcr.io/hiwjdgh/next-frontend  # [ORG] ghcr.io/<org>/next-frontend 로 변경
SERVER_NAME=next.localhost
CONTAINER_PORT=3000
HEALTH_PATH=/  # 실제 앱에서는 app/api/health/route.ts 등을 만들고 /api/health 로 변경 권장
MEMORY_LIMIT=512m  # 기본 상한 (서버별 변경은 .env 의 MEMORY_LIMIT_NEXT_FRONTEND)
NODE_HEAP_PERCENT=75  # NODE_OPTIONS=--max-old-space-size 를 상한의 75%로 자동 설정
