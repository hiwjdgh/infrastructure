events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;
  sendfile on;
  server_tokens off;
  # Longer than the ALB idle timeout (60s) so the ALB never reuses a connection Nginx has closed.
  keepalive_timeout 75s;
  # WebSocket upgrade support (Next.js / Nest.js gateways)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  # Behind AWS ALB: restore the real client IP from X-Forwarded-For sent by the ALB (VPC private ranges).
  # The EC2 security group must allow HTTP_PORT only from the ALB security group.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  # Pass the ALB's headers through to apps (local: no ALB -> fall back to this hop's values).
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }
  map $http_x_forwarded_for $forwarded_for {
    default $http_x_forwarded_for;
    ''      $remote_addr;
  }

  include /etc/nginx/routes/*.conf;
  server {
    listen 80 default_server;
    server_name _;
    # ALB target group health check (Host is the instance IP, so it lands here).
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }
    location / {
      return 404;
    }
  }
}
