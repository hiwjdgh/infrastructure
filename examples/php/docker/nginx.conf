# COPY INTO THE PHP REPO: docker/nginx.conf  (in-container web server in front of php-fpm)
# __DOCUMENT_ROOT__ is replaced at build time from the DOCUMENT_ROOT build arg.

# Trust X-Forwarded-For from the platform Nginx (Docker network) so PHP sees the real client IP.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

map $http_x_forwarded_proto $fastcgi_https {
  default '';
  https   on;
}

server {
  listen 80 default_server;
  server_name _;
  root __DOCUMENT_ROOT__;
  index index.php index.html;
  client_max_body_size 20m;
  server_tokens off;

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    try_files $fastcgi_script_name =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_param HTTPS $fastcgi_https;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_read_timeout 60s;
  }

  location ~ /\.(?!well-known) {
    deny all;
  }
}
