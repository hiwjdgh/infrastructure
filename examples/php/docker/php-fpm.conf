; COPY INTO THE PHP REPO: docker/php-fpm.conf  (loaded after the image's zz-docker.conf)
[www]
; Only nginx inside this container may talk FastCGI.
listen = 127.0.0.1:9000

; Process count bounds memory use: roughly PHP_FPM_MAX_CHILDREN × (30~60MB per worker) must fit the
; container memory limit (MEMORY_LIMIT in services/<service>.conf or .env). Default 10 fits 512m.
; Override per server in environments/<APP_ENV>/<service>.env, e.g. PHP_FPM_MAX_CHILDREN=30 for a 2g limit.
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
